  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { height: 100%; }

    #header { padding: 10px 16px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; flex-shrink: 0; }
    #header h1 { font-size: 1.2rem; color: #e94560; letter-spacing: 1px; }
    #header p { font-size: 0.78rem; color: #aaa; }
    #map { flex: 1; min-height: 0; }

    /* Day legend */
    #legend { position: absolute; bottom: 16px; right: 10px; z-index: 1000; background: rgba(22,33,62,0.95); border: 1px solid #0f3460; border-radius: 8px; min-width: 200px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); max-height: 80vh; overflow-y: auto; }
    #legend-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px 14px; cursor: pointer; user-select: none; }
    #legend h3 { font-size: 0.8rem; color: #e94560; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
    #legend-toggle { font-size: 1rem; color: #e94560; }
    #legend-body { padding: 0 14px 10px 14px; }
    #legend-body.collapsed { display: none; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 0.78rem; cursor: pointer; border-radius: 4px; padding: 2px 4px; transition: background 0.15s; }
    .legend-row:hover { background: rgba(255,255,255,0.07); }
    .legend-line { width: 28px; height: 4px; border-radius: 2px; flex-shrink: 0; }
    .legend-km { color: #888; font-size: 0.7rem; margin-left: auto; padding-left: 4px; }
    .badge { font-size: 0.6rem; background: #e94560; color: #fff; border-radius: 3px; padding: 1px 4px; margin-left: 2px; }

    /* GPS */
    #gps-btn { background: #0f3460; border: 1px solid #e94560; color: #eee; padding: 5px 11px; border-radius: 5px; cursor: pointer; font-size: 0.78rem; display: flex; align-items: center; gap: 5px; transition: background 0.2s; flex-shrink: 0; white-space: nowrap; }
    #gps-btn:hover { background: #1a4a80; }
    #gps-btn.active { background: #e94560; border-color: #e94560; color: #fff; }
    #gps-btn.searching { border-color: #ffa726; color: #ffa726; }
    .gps-marker { position: relative; width: 20px; height: 20px; }
    .gps-marker-dot { position: absolute; top: 4px; left: 4px; width: 12px; height: 12px; border-radius: 50%; background: #4a90d9; border: 2px solid #fff; box-shadow: 0 0 6px rgba(74,144,217,0.9); z-index: 2; }
    .gps-marker-ring { position: absolute; top: 0; left: 0; width: 20px; height: 20px; border-radius: 50%; background: rgba(74,144,217,0.35); animation: gps-pulse 1.8s ease-out infinite; }
    @keyframes gps-pulse { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }

    /* Leaflet layer control — dark theme */
    .leaflet-control-layers { background: rgba(22,33,62,0.95) !important; border: 1px solid #0f3460 !important; border-radius: 8px !important; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .leaflet-control-layers-expanded { padding: 8px 14px 10px !important; min-width: 200px; }
    .leaflet-control-layers label { color: #eee !important; font-size: 0.78rem !important; margin: 5px 0 !important; cursor: pointer; display: flex !important; align-items: center !important; gap: 5px !important; }
    .leaflet-control-layers span { color: #eee !important; }
    .leaflet-control-layers-separator { border-color: #0f3460 !important; margin: 6px 0 !important; }
    .leaflet-control-layers-toggle { background-color: #16213e !important; border: 1px solid #e94560 !important; border-radius: 4px !important; }

    /* Scenic route labels */
    .sr-label { background: #2d1a06; color: #fff; border-radius: 4px; padding: 3px 7px; font-size: 0.62rem; font-weight: bold; white-space: nowrap; box-shadow: 0 2px 7px rgba(0,0,0,0.7); line-height: 1.4; cursor: pointer; }
    .sr-label.start { border-left: 3px solid #2ecc71; }
    .sr-label.end   { border-left: 3px solid #e74c3c; }
    .sr-sub { font-size: 0.52rem; opacity: 0.75; display: block; margin-bottom: 1px; }

    /* POI dots */
    .poi-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.6); font-size: 14px; cursor: pointer; }

    /* Fuel stop labels */
    .fuel-label { background: #bf360c; color: #fff; border-radius: 4px; padding: 3px 7px; font-size: 0.63rem; font-weight: bold; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.65); cursor: pointer; border-left: 3px solid #ffcc00; }

    /* Accommodation markers — pentagon + blue connector */
    .accom-pentagon { width: 40px; height: 40px; clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; cursor: pointer; }

    @media (max-width: 600px) {
      #header { padding: 6px 10px; }
      #header h1 { font-size: 0.95rem; }
      #header p { display: none; }
      #legend { bottom: 10px; right: 8px; min-width: 160px; max-width: 80vw; }
    }
  </style>
</head>

// Draw day routes + legend
days.forEach(day => {

  line.bindTooltip(`<b>${day.label}</b><br>${day.km}${day.tourist.length ? '<br>🗺️ ' + day.tourist.join(', ') : ''}`, { sticky: true });
  const row = document.createElement('div');

});

// Draw main markers
mainMarkers.forEach(m => {

    className: '', iconAnchor: [5,5]
  });

});

// Draw scenic route start/end markers
function srIcon(type, name) {
  const cls  = type === 'start' ? 'start' : 'end';
  const lbl  = type === 'start' ? '▶ ALKU' : 'LOPPU ◼';
  const short = name.length > 18 ? name.slice(0,16)+'…' : name;
  return L.divIcon({
    html: `<div class="sr-label ${cls}"><span class="sr-sub">${lbl}</span>${short}</div>`,
    className: '', iconAnchor: [0, 28]
  });
}

function srPopup(r, type) {
  const isStart = type === 'start';
  const loc  = isStart ? r.start : r.end;
  const badge = isStart
    ? '<span style="background:#2ecc71;color:#1a1a2e;padding:1px 6px;border-radius:3px;font-size:0.7rem;font-weight:bold">▶ ALKU</span>'
    : '<span style="background:#e74c3c;color:#fff;padding:1px 6px;border-radius:3px;font-size:0.7rem;font-weight:bold">◼ LOPPU</span>';
  return `<b>🗺️ ${r.name}</b><br>${badge} <b>${loc.place}</b><br>${loc.note}<br><small style="color:#aaa">${r.km} km &nbsp;·&nbsp; ${r.elev} &nbsp;·&nbsp; Päivä ${r.day}</small>`;
}

function drawScenicRoute(r, layer) {
  ['start', 'end'].forEach(type => {
    const loc = type === 'start' ? r.start : r.end;
    const dLon = type === 'start' ? -0.028 : 0.028;
    const iLat = loc.lat + 0.032;
    const iLon = loc.lon + dLon;
    const dotColor = type === 'start' ? '#2ecc71' : '#e74c3c';
    const popup = srPopup(r, type);

    L.polyline([[loc.lat, loc.lon], [iLat, iLon]], {
      color: '#ffcc00', weight: 1.5, opacity: 0.85, dashArray: '6,5'
    }).addTo(layer);

    L.circleMarker([loc.lat, loc.lon], {
      radius: 5, color: '#fff', weight: 2, fillColor: dotColor, fillOpacity: 1
    }).addTo(layer).bindPopup(popup);

    L.marker([iLat, iLon], { icon: srIcon(type, r.name), zIndexOffset: 500 })
      .addTo(layer).bindPopup(popup);
  });
}
scenicRoutes.forEach(r => drawScenicRoute(r, layerScenic));

// Draw extra POIs — offset icon + dashed connector + exact-point dot
function poiIcon(emoji, bg) {
  return L.divIcon({
    html: `<div class="poi-dot" style="background:${bg}">${emoji}</div>`,
    className: '', iconAnchor: [14,14]
  });
}

function drawPOI(p, layer) {
  const iLat = p.exactLat + p.dLat;
  const iLon = p.exactLon + p.dLon;

  L.polyline([[p.exactLat, p.exactLon], [iLat, iLon]], {
    color: '#ffcc00', weight: 1.5, opacity: 0.85, dashArray: '6,5'
  }).addTo(layer);

  L.circleMarker([p.exactLat, p.exactLon], {
    radius: 4, color: '#fff', weight: 1.5, fillColor: p.bg, fillOpacity: 1
  }).addTo(layer).bindPopup(p.popup);

  L.marker([iLat, iLon], { icon: poiIcon(p.icon, p.bg), zIndexOffset: 400 })
    .addTo(layer).bindPopup(p.popup);
}

extraPOIs.forEach(p => drawPOI(p, layerPOI));

const SEP = '<hr style="margin:5px 0;border:none;border-top:1px solid #ccc">';
function drawAccom(a) {
  const iLat = a.lat + a.dLat;
  const iLon = a.lon + a.dLon;
  const isPlanned = a.type === 'planned';
  const bg = isPlanned ? '#2e7d32' : '#006064';
  const emoji = isPlanned ? '🏕️' : '🏠';
  const parts = a.popup.split('<br>');
  const pop = parts.length >= 3
    ? parts[0] + '<br>' + parts[1] + SEP + parts[2] + (parts.length > 3 ? SEP + parts.slice(3).join('<br>') : '')
    : a.popup;
  L.polyline([[a.lat, a.lon], [iLat, iLon]], {
    color: '#2196f3', weight: 3.5, opacity: 0.9
  }).addTo(layerAccommodation).bindPopup(pop);
  L.circleMarker([a.lat, a.lon], {
    radius: 5, color: '#fff', weight: 2, fillColor: bg, fillOpacity: 1
  }).addTo(layerAccommodation).bindPopup(pop);
  const icon = L.divIcon({
    html: `<div class="accom-pentagon" style="background:${bg}">${emoji}</div>`,
    className: '', iconAnchor: [20, 40]
  });
  L.marker([iLat, iLon], { icon, zIndexOffset: isPlanned ? 450 : 420 })
    .addTo(layerAccommodation).bindPopup(pop);
}
accommodation.forEach(drawAccom);

// Layer control
L.control.layers(null, {
  '🛣️ Päiväreitit':                    layerRoutes,
  '⛺ Yöpymispaikat &amp; kohteet':     layerMarkers,
  '🗺️ Maisematiet — alku &amp; loppu': layerScenic,
  '📍 Lisäkäyntipaikat':                layerPOI,
  '⛽ Tankkauspaikat':                   layerFuel,
  '🛏️ Majoitusvaihtoehdot':             layerAccommodation
}, { position: 'topright', collapsed: true }).addTo(map);

// Scale bar
L.control.scale({ imperial: false, metric: true, position: 'bottomleft' }).addTo(map);

// Fit map
const allCoords = days.flatMap(d => d.coords);
map.fitBounds(L.latLngBounds(allCoords), { padding: [20,20] });
setTimeout(() => map.invalidateSize(), 300);

// Legend toggle
function toggleLegend() {
  const body   = document.getElementById('legend-body');
  const toggle = document.getElementById('legend-toggle');
  const c = body.classList.toggle('collapsed');
  toggle.textContent = c ? '▼' : '▲';
}
if (window.innerWidth <= 600) toggleLegend();

// ── GPS ───────────────────────────────────────────────────────────────────────
let gpsMarker = null, gpsCircle = null, gpsWatch = null, gpsTracking = false, gpsFirstFix = true;

const gpsIcon = L.divIcon({
  html: '<div class="gps-marker"><div class="gps-marker-ring"></div><div class="gps-marker-dot"></div></div>',
  className: '', iconAnchor: [10,10]
});

function toggleGPS() {
  const btn = document.getElementById('gps-btn');
  if (gpsTracking) {
    if (gpsWatch !== null) { navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }
    if (gpsMarker) { map.removeLayer(gpsMarker); gpsMarker = null; }
    if (gpsCircle) { map.removeLayer(gpsCircle); gpsCircle = null; }
    gpsTracking = false; gpsFirstFix = true;
    btn.className = ''; btn.title = 'Näytä sijaintisi kartalla';
  } else {
    if (!navigator.geolocation) { alert('Selaimesi ei tue sijaintipalveluita.'); return; }
    if (!window.isSecureContext) {
      alert('Sijainti toimii vain suojatulla yhteydellä (https://).\n\nAvaa kartta https-osoitteesta (esim. GitHub Pages / Netlify) — paikallisesta tiedostosta (file://) tai http-osoitteesta selain estää sijainnin.');
      return;
    }
    gpsTracking = true;
    btn.classList.add('searching');
    btn.title = 'Pysäytä sijaintiseuranta';
    gpsWatch = navigator.geolocation.watchPosition(onGPSSuccess, onGPSError, {
      enableHighAccuracy: true, timeout: 15000, maximumAge: 0
    });
  }
}

function onGPSSuccess(pos) {
  const lat = pos.coords.latitude, lon = pos.coords.longitude, acc = pos.coords.accuracy;
  document.getElementById('gps-btn').className = 'active';
  const popup = `<b>📍 Sijaintisi</b><br>Tarkkuus: ±${Math.round(acc)} m`;
  if (!gpsMarker) {
    gpsMarker = L.marker([lat,lon], { icon: gpsIcon, zIndexOffset: 2000 }).addTo(map).bindPopup(popup);
    gpsCircle = L.circle([lat,lon], { radius: acc, color:'#4a90d9', fillColor:'#4a90d9', fillOpacity:0.08, weight:1 }).addTo(map);
  } else {
    gpsMarker.setLatLng([lat,lon]).getPopup().setContent(popup);
    gpsCircle.setLatLng([lat,lon]).setRadius(acc);
  }
  if (gpsFirstFix) { map.setView([lat,lon], Math.max(map.getZoom(), 9)); gpsFirstFix = false; }
}

function onGPSError(err) {
  document.getElementById('gps-btn').className = '';
  gpsTracking = false;
  if (gpsWatch !== null) { navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; }
  let msg = { 1:'Sijainnin käyttö estetty. Salli sijainti selaimen asetuksissa.', 2:'Sijaintia ei voitu määrittää. Tarkista yhteys.', 3:'Sijaintipalvelu aikakatkaisu. Yritä uudelleen.' }[err.code] || 'Sijaintia ei voitu määrittää.';
  if (err.code === 1 && !window.isSecureContext) {
    msg = 'Sijainti toimii vain suojatulla yhteydellä (https://). Avaa kartta https-osoitteesta, ei paikallisesta tiedostosta.';
  }
  alert(msg);
}
</script>
